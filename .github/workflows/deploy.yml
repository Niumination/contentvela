name: Deploy contentvela to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the workflow push to the Pages branch.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once — queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        # The npm 10.9.x shipped with Node 22 intermittently dies on the
        # ubuntu runner ("Exit handler never called!" after ~70s, exit 1) even
        # with a valid lockfile. npm 11 on Node 24 is used instead; the second
        # command is a safety net if that one ever regresses the same way.
        run: |
          npm ci --no-audit --no-fund --loglevel=error || \
          npm install --no-audit --no-fund --loglevel=error

      - name: Test
        run: npm test

      - name: Typecheck and build
        # Node 24 runs the toolchain (Vite 8 / TS 6 / Vitest 5), but keep the
        # engines field honest for local dev on Node 22.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Show toolchain versions
        run: node --version && npm --version

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
