name: Deploy contentvela to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the workflow push to the Pages branch.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once — queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck and build
        # BASE_PATH must match the repo name, because Pages serves the app
        # from https://<user>.github.io/contentvela/ — not the domain root.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
